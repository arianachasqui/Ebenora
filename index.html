<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebenora · Compra, confía, recibe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--ink:#0b0b0b;--gold:#b8862b;--gold2:#e2b55a;--cream:#fbf3e6;--card:#fffaf1;--line:#ead9b8;--txt:#2a2420;--ok:#25a244;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--txt);font:15px/1.55 Montserrat,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;color:var(--ink)}
button,input,textarea{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{background:var(--ink);color:var(--gold2);text-align:center;font-size:12.5px;letter-spacing:.06em;padding:8px 10px}
header{background:var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--gold)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
header img{height:54px;width:54px;border-radius:50%}
.brand{display:flex;align-items:center;gap:12px;color:var(--cream);font-family:"Cormorant Garamond",serif;font-size:26px;letter-spacing:.14em;font-weight:600}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1206;border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;letter-spacing:.03em}
.btn.dark{background:var(--ink);color:var(--gold2)}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.wa{background:var(--ok);color:#fff;width:100%;padding:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cartbtn{position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--ink);border-radius:999px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;border:1px solid var(--gold)}
.hero{background:var(--cream);border-bottom:1px solid var(--line)}
.hero img{width:100%;max-width:1200px;height:auto;display:block;margin:0 auto}
.hero .txt{text-align:center;padding:26px 0 34px}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.1}
.hero p{max-width:560px;margin:12px auto 20px}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:26px 0}
.t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.t b{display:block;color:var(--ink);margin:4px 0 2px}.t span.i{font-size:26px}
.t small{color:#6b5d4a}
h2.sec{text-align:center;font-size:clamp(28px,5vw,40px);margin:34px 0 6px}
.sub{text-align:center;color:#6b5d4a;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(120,84,20,.08)}
.p .im{aspect-ratio:1/1;background:linear-gradient(135deg,#f3e2bd,#fff6e3);display:grid;place-items:center;font-size:60px;overflow:hidden}
.p .im img{width:100%;height:100%;object-fit:cover}
.p .b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.p h3{font-size:24px;line-height:1.15}
.p .d{color:#6b5d4a;font-size:13.5px;flex:1;white-space:pre-line}
.price{font-size:22px;font-weight:600;color:var(--ink)}
.price s{font-size:14px;color:#9a8a72;font-weight:400;margin-left:8px}
.tag{font-size:12px;color:var(--ok);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s}
.st{background:var(--ink);color:var(--cream);border-radius:14px;padding:20px;position:relative}
.st::before{counter-increment:s;content:counter(s);font-family:"Cormorant Garamond",serif;font-size:42px;color:var(--gold2);display:block;line-height:1}
.st b{color:var(--gold2)}
footer{background:var(--ink);color:#cdbf9f;text-align:center;padding:30px 18px 90px;margin-top:40px;font-size:13px}
footer img{height:80px;border-radius:50%}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;border-radius:999px;padding:13px 18px;font-weight:600;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:15}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--cream);padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column;gap:12px}
.drawer .hd{display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:28px;cursor:pointer;color:var(--ink)}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.li .n{flex:1;font-weight:500}.li .n small{display:block;color:#6b5d4a}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);background:#fff;cursor:pointer}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
label{font-size:12.5px;font-weight:600;color:#6b5d4a;display:block;margin:8px 0 3px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:600;color:var(--ink);border-top:1px solid var(--line);padding-top:10px}
.note{font-size:12.5px;color:#6b5d4a;text-align:center}
.adm{position:absolute;inset:0;background:var(--cream);overflow:auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.adm .wrap{max-width:760px}
.ar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{width:90px;height:90px;border-radius:10px;object-fit:cover;background:#f3e2bd;display:grid;place-items:center;font-size:30px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--gold2);padding:10px 18px;border-radius:999px;z-index:60;display:none}

input,textarea{font-size:16px}
.hero{overflow:hidden}
@media(max-width:600px){
 .hero img{width:125%;max-width:none;margin-left:-12.5%;aspect-ratio:2048/560;object-fit:cover;object-position:center top}
 .hero .txt{padding:18px 0 26px}
 .trust{grid-template-columns:1fr 1fr;gap:10px}
 .t{padding:12px 8px}.t small{font-size:12px}
 .grid{grid-template-columns:1fr}
}
@media(max-width:480px){
 .wrap{padding:0 14px}
 header .wrap{height:60px}
 header img{height:42px;width:42px}
 .brand{font-size:20px;letter-spacing:.08em;gap:8px}
 header .btn{padding:10px 14px;font-size:13px}
 .top{font-size:11.5px}
 .q button{width:34px;height:34px}
 .fab{padding:12px 15px}
 .drawer{padding:14px}
}
@media(max-width:340px){.brand span{display:none}}
</style>
</head>
<body>

<div id="root"></div>
<div class="ov" id="cartov"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>
<script>
const LOGO="logo.webp",BANNER="banner.webp";
let S={s:{wa:'',bar:''},p:[]};
let cart={},canAdmin=false;
try{cart=JSON.parse(localStorage.getItem('ebn_cart')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const prods=()=>S.p.filter(p=>p.on);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function save(){try{localStorage.setItem('ebn_cart',JSON.stringify(cart))}catch(e){}}
function render(){
  const ps=prods();
  $('root').innerHTML=`
  <div class="top">${esc(S.s.bar)}</div>
  <header><div class="wrap"><div class="brand"><img src="${LOGO}" alt="Ebenora"><span>EBENORA</span></div>
  <div style="display:flex;gap:8px;align-items:center">${canAdmin?'<button class="btn ghost" id="admbtn">⚙ Admin</button>':''}<button class="btn cartbtn" id="cartbtn">🛒 Carrito<span class="badge">${count()}</span></button></div></div></header>
  <section class="hero"><img src="${BANNER}" alt="Ebenora: compra, confía, recibe"><div class="wrap txt"><h1>Pide hoy, paga cuando lo recibes</h1><p>Envíos contra entrega a todo el país. Confirmas tu pedido por WhatsApp y te acompañamos hasta que llegue a tu puerta.</p><a href="#productos"><button class="btn">Ver productos</button></a></div></section>
  <div class="wrap">
  <div class="trust"><div class="t"><span class="i">📦</span><b>Pago contra entrega</b><small>No pagas nada por adelantado</small></div><div class="t"><span class="i">🚚</span><b>Envíos a todo el país</b><small>Llega directo a tu dirección</small></div><div class="t"><span class="i">🛡️</span><b>Compra segura</b><small>Revisas y pagas al recibir</small></div><div class="t"><span class="i">💬</span><b>Atención por WhatsApp</b><small>Te respondemos rápido</small></div></div>
  <h2 class="sec" id="productos">Nuestros productos</h2><p class="sub">Selección cuidada · Envío contra entrega</p>
  <div class="grid">${ps.map(p=>`<article class="p"><div class="im">${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:'🛍️'}</div><div class="b"><h3>${esc(p.name)}</h3><div class="d">${esc(p.desc)}</div><div class="price">${money(p.price)}${p.old>p.price?`<s>${money(p.old)}</s>`:''}</div><div class="tag">✔ Pagas al recibir · Envío a todo el país</div><button class="btn" data-add="${p.id}">Agregar al carrito</button></div></article>`).join('')||'<p class="sub">Pronto nuevos productos.</p>'}</div>
  <h2 class="sec">¿Cómo comprar?</h2><p class="sub">Simple y sin riesgos</p>
  <div class="steps"><div class="st"><b>Elige</b><br>Agrega tus productos al carrito.</div><div class="st"><b>Confirma por WhatsApp</b><br>Envías tu pedido con tus datos de entrega.</div><div class="st"><b>Recibe y paga</b><br>Pagas en efectivo al recibir en tu casa.</div></div>
  </div>
  <footer><img src="${LOGO}" alt="Ebenora"><p><b style="color:#e2b55a;letter-spacing:.2em">COMPRA · CONFÍA · RECIBE</b></p><p>Envíos contra entrega a todo el país · Atención por WhatsApp</p><p>© ${new Date().getFullYear()} Ebenora</p></footer>
  <a class="fab" target="_blank" rel="noopener" href="https://wa.me/${esc(S.s.wa)}?text=${encodeURIComponent('Hola Ebenora, tengo una pregunta 👋')}">💬 WhatsApp</a>`;
  $('cartbtn').onclick=openCart;
  
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;save();render();toast('Agregado al carrito ✔')});
}
function items(){return Object.entries(cart).map(([id,q])=>({p:S.p.find(x=>x.id===id),q})).filter(i=>i.p&&i.q>0)}
function openCart(){$('cartov').classList.add('on');drawCart()}
function drawCart(){
  const it=items(),tot=it.reduce((a,i)=>a+i.p.price*i.q,0),d=$('drawer');
  d.innerHTML=`<div class="hd"><h2>Tu pedido</h2><button class="x" id="cx">×</button></div>`+(it.length?it.map(i=>`<div class="li"><div class="n">${esc(i.p.name)}<small>${money(i.p.price)}</small></div><div class="q"><button data-m="${i.p.id}">−</button><b>${i.q}</b><button data-pl="${i.p.id}">+</button></div></div>`).join('')+`<div class="total"><span>Total</span><span>${money(tot)}</span></div><div class="note">Pagas ${money(tot)} en efectivo al recibir. Envío contra entrega.</div>
  <div><label>Nombre completo</label><input id="fn"><label>Teléfono</label><input id="fp" inputmode="tel"><label>Ciudad y departamento</label><input id="fc"><label>Dirección de entrega</label><input id="fa"><label>Observaciones (opcional)</label><textarea id="fo" rows="2"></textarea></div>
  <button class="btn wa" id="send">Enviar pedido por WhatsApp</button><div class="note">🔒 Tus datos solo se usan para el envío.</div>`:'<p class="sub">Tu carrito está vacío.</p>');
  $('cx').onclick=()=>$('cartov').classList.remove('on');
  d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cart[b.dataset.m]--;if(cart[b.dataset.m]<=0)delete cart[b.dataset.m];save();render();drawCart()});
  d.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{cart[b.dataset.pl]++;save();render();drawCart()});
  if($('send'))$('send').onclick=()=>{
    const v=id=>$(id).value.trim(),n=v('fn'),p=v('fp'),c=v('fc'),a=v('fa');
    if(!n||!p||!c||!a){toast('Completa nombre, teléfono, ciudad y dirección');return}
    const msg=`Hola Ebenora 👋 quiero hacer este pedido *CONTRA ENTREGA*:\n\n`+it.map(i=>`• ${i.q} x ${i.p.name} — ${money(i.p.price*i.q)}`).join('\n')+`\n\n*Total a pagar al recibir: ${money(tot)}*\n\n*Nombre:* ${n}\n*Teléfono:* ${p}\n*Ciudad:* ${c}\n*Dirección:* ${a}`+(v('fo')?`\n*Obs:* ${v('fo')}`:'');
    window.open(`https://wa.me/${S.s.wa}?text=${encodeURIComponent(msg)}`,'_blank');
  };
}
$('cartov').onclick=e=>{if(e.target.id==='cartov')$('cartov').classList.remove('on')};
fetch('products.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{S=d;render()}).catch(()=>render());
</script>
</body>
</html>
